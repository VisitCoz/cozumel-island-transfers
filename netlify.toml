# The booking page lived here while it was being built, and the URL is in Mike's
# notes, in chat history and in at least one Stripe session. Send it home.
[[redirects]]
  from = "/proto/flow-prototype.html"
  to = "/"
  status = 301

# Security headers — defaults that any production site should have
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ══════════════════════════════════════════════════════════════════════════════
# THE OLD SQUARESPACE SITE
#
# Every path that is live on www.cozumelislandtransfers.com today, taken from its
# own sitemap on 2026-08-06. The day DNS points here, anything not listed 404s —
# and some of these are printed on booking confirmations guests are still holding.
#
# Three of them are the meeting-point pages, and they are the reason this map is
# worth doing properly rather than sweeping everything to the homepage: a guest who
# saved /maya before she sailed is standing on a pier looking for directions, not
# shopping. She gets directions.
#
# Note: the old site's canonical host is www. The apex already 301s to www there,
# and Netlify should keep serving www as primary so the thousands of printed and
# emailed links keep resolving without an extra hop.
# ══════════════════════════════════════════════════════════════════════════════

