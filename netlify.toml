# The booking page lived here while it was being built, and the URL is in Mike's
# notes, in chat history and in at least one Stripe session. Send it home.
[[redirects]]
  from = "/proto/flow-prototype.html"
  to = "/"
  status = 301

# Security headers — defaults that any production site should have
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
