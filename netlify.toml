[build]
  publish = "."
  functions = "netlify/functions"

# The day-before job. 14:00 UTC = 9 AM Cozumel (UTC-5, no daylight saving).
#
# It ran at 6 PM until Mike pointed out the obvious: a manifest that lands after
# the office has gone home leaves nobody time to fix a day that doesn't add up.
# 9 AM gives a full working day to find a driver, split a run, or call a guest.
[functions."daily-manifest"]
  schedule = "0 14 * * *"

# The eleven pages the booking flow replaced on 2026-08-06. They are gone from the
# build but they are not gone from the internet — they sat in the sitemap for months
# and anything that linked to them would otherwise land on a 404 instead of a page
# that can take the booking. 301, because the move is permanent.
#
# NOT the redirect map for the domain cutover. When cozumelislandtransfers.com finally
# points here, the 29 live Squarespace URLs need their own entries — different paths
# (/czm, /shared, /onewayservice, /ssa, /maya …) and that is a separate job.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/cruise-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/airport-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/tierra-maya.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/kuza.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/san-gervasio.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/chankanaab.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/bucanos.html"
  to = "/"
