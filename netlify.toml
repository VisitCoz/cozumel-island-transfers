[build]
  publish = "."
  functions = "netlify/functions"

# The day-before job. 14:00 UTC = 9 AM Cozumel (UTC-5, no daylight saving).
#
# It ran at 6 PM until Mike pointed out the obvious: a manifest that lands after
# the office has gone home leaves nobody time to fix a day that doesn't add up.
# 9 AM gives a full working day to find a driver, split a run, or call a guest.
[functions."daily-manifest"]
  schedule = "0 14 * * *"

# The eleven pages the booking flow replaced on 2026-08-06. They are gone from the
# build but they are not gone from the internet — they sat in the sitemap for months
# and anything that linked to them would otherwise land on a 404 instead of a page
# that can take the booking. 301, because the move is permanent.
#
# The Squarespace map is further down, under "THE OLD SQUARESPACE SITE".
# force, because Netlify serves a matching static file before it consults the rules —
# without it /index.html and / are two URLs showing the same page.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cruise-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/airport-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/tierra-maya.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/kuza.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/san-gervasio.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/chankanaab.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/bucanos.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/paradise-beach.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/mr-sanchos.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/nachi-cocom.html"
  to = "/"
  status = 301

# The booking page lived here while it was being built, and the URL is in Mike's
# notes, in chat history and in at least one Stripe session. Send it home.
[[redirects]]
  from = "/proto/flow-prototype.html"
  to = "/"
  status = 301

# Security headers — defaults that any production site should have
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ══════════════════════════════════════════════════════════════════════════════
# THE OLD SQUARESPACE SITE
#
# Every path that is live on www.cozumelislandtransfers.com today, taken from its
# own sitemap on 2026-08-06. The day DNS points here, anything not listed 404s —
# and some of these are printed on booking confirmations guests are still holding.
#
# Three of them are the meeting-point pages, and they are the reason this map is
# worth doing properly rather than sweeping everything to the homepage: a guest who
# saved /maya before she sailed is standing on a pier looking for directions, not
# shopping. She gets directions.
#
# Note: the old site's canonical host is www. The apex already 301s to www there,
# and Netlify should keep serving www as primary so the thousands of printed and
# emailed links keep resolving without an extra hop.
# ══════════════════════════════════════════════════════════════════════════════

# --- the meeting points: the three that actually matter ---
[[redirects]]
  from = "/maya"
  to = "/meet/puerta-maya.html"
  status = 301

