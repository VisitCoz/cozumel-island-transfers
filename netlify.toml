[build]
  publish = "."
  functions = "netlify/functions"

# The day-before job. 14:00 UTC = 9 AM Cozumel (UTC-5, no daylight saving).
#
# It ran at 6 PM until Mike pointed out the obvious: a manifest that lands after
# the office has gone home leaves nobody time to fix a day that doesn't add up.
# 9 AM gives a full working day to find a driver, split a run, or call a guest.
[functions."daily-manifest"]
  schedule = "0 14 * * *"

# ── Source files that must not be served ─────────────────────────────────────
# `publish = "."` means the whole repo is a web root, so every one of these was
# reachable and returning 200 to anyone who guessed the path. Verified 2026-08-07.
#
# Nothing here contained a live key — checked for sk_live / rk_live / pk_live /
# whsec_ / re_ / AIza and found none. What it did contain was worse in a different
# way: CLAUDE.md publishing an out-of-date claim that the payment system charges
# MX$100 by mistake, five staff addresses in booking-script-CIT.js ready to be
# phished, and a discount code. Dotfiles and netlify.toml were already blocked by
# Netlify itself; .git is not exposed.
#
# 404 rather than 403 — a 403 confirms the file is there.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/booking-script-CIT.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps_script/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Design scratch — half-finished style studies that were never meant to be pages.
# robots.txt already disallows them, but disallow only stops future crawling: Google had
# already found them, which is what the 2026-08-09 "Excluded by noindex" notice is about.
# They also render internal notes (Stripe fee comparisons, the old MX$100 pricing bug) to
# anyone who guesses the path. 404 them properly rather than relying on a meta tag.
[[redirects]]
  from = "/proto/*"
  to = "/404.html"
  status = 404
  force = true

# ── www → apex, and it must come BEFORE every path rule below ────────────────
# One canonical address. Every page's canonical tag says the bare domain, so this
# makes the redirect agree with what we already tell Google, and stops a visit to
# www and a visit to the apex counting as two different pages.
#
# The 404 blocks above are the only rules allowed to precede it, and they are
# harmless here: a request for www/CLAUDE.md should 404 outright rather than take
# a redirect to the apex first.
#
# It sits ahead of the rest on purpose: every other rule below matches on path only, so they
# apply to www as well. If /maya were matched first, a www visitor would be sent to
# www/meet/puerta-maya.html and stay on www forever. Sending the host to the apex
# before anything else means the path rules then run exactly once, on one hostname.
#
# :splat carries the rest of the path and the query string, so
# www.…/meet/puerta-maya.html lands on her walking directions, not the homepage.
#
# This lives here rather than in a Cloudflare redirect rule because Cloudflare passes
# the original Host through to Netlify, so Netlify can answer it — and a rule in the
# repo is reviewable and revertable, which a click in a dashboard is not.
[[redirects]]
  from = "https://www.cozumelislandtransfers.com/*"
  to = "https://cozumelislandtransfers.com/:splat"
  status = 301
  force = true

# The eleven pages the booking flow replaced on 2026-08-06. They are gone from the
# build but they are not gone from the internet — they sat in the sitemap for months
# and anything that linked to them would otherwise land on a 404 instead of a page
# that can take the booking. 301, because the move is permanent.
#
# The Squarespace map is further down, under "THE OLD SQUARESPACE SITE".
# force, because Netlify serves a matching static file before it consults the rules —
# without it /index.html and / are two URLs showing the same page.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cruise-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/airport-transfers.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/tierra-maya.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/kuza.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/san-gervasio.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/chankanaab.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/bucanos.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/paradise-beach.html"
  to = "/"
