[build]
  publish = "."
  functions = "netlify/functions"

# The day-before job. 14:00 UTC = 9 AM Cozumel (UTC-5, no daylight saving).
#
# It ran at 6 PM until Mike pointed out the obvious: a manifest that lands after
# the office has gone home leaves nobody time to fix a day that doesn't add up.
# 9 AM gives a full working day to find a driver, split a run, or call a guest.
[functions."daily-manifest"]
  schedule = "0 14 * * *"

# Security headers — defaults that any production site should have
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
